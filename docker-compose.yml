# CampusLink local infrastructure. Currently just Kafka, used only when the backend runs with
# nexploy.kafka.enabled=true (KAFKA_ENABLED=true). Everything else (Postgres, ML, OR-Tools) is
# started as documented in docs/RUNBOOK.md; this file exists so the optional Kafka transport has a
# one-command broker for local dev and demos.
#
#   docker compose up -d kafka      # start the broker
#   docker compose down             # stop and remove it
#
# Single-node KRaft (no ZooKeeper). The host listener is localhost:9092, which matches the backend's
# default KAFKA_BOOTSTRAP_SERVERS.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: campuslink-kafka
    ports:
      - "9092:9092"
    environment:
      # Combined broker + controller on a single node.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for in-cluster/host access on 9092; CONTROLLER on 9093.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node replication settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Let the backend's first publish create the topic (dev convenience).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
